name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snakemake and the plugin
        # non-editable on purpose: snakemake's plugin registry uses
        # pkgutil.iter_modules, which does not see editable installs
        run: |
          python -m pip install --upgrade pip
          pip install snakemake
          pip install '.[artifacts,validate]'

      - name: Check the plugin is discoverable (same probe as the plugin catalog)
        run: |
          python -c "
          from snakemake_interface_report_plugins.registry import ReportPluginRegistry
          plugin = ReportPluginRegistry().get_plugin('fairscape')
          print(len(plugin.get_settings_info()), 'settings')"

      - name: Run the example workflows
        run: tools/run-examples.sh
