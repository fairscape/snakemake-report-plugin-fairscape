[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemake-report-plugin-fairscape"
dynamic = ["version"]
description = "Snakemake report plugin that writes a FAIRSCAPE EVI RO-Crate (ro-crate-metadata.json) for a completed run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Justin Niestroy", email = "jniestroy@gmail.com" },
]
keywords = ["snakemake", "snakemake-plugin", "report", "fairscape", "ro-crate", "provenance", "evi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "snakemake-interface-report-plugins >=1.3.0,<2",
    "snakemake-interface-common",
    "fairscape-conversion >=0.2.2,<0.3",
]

[project.optional-dependencies]
# The inverse links, EVI:inputs/outputs, evidence graph and datasheet are on by
# default and come from fairscape-artifacts (0.2.0 added link-inverses);
# without it the crate and the D4D/LinkML export are still written and those
# steps are skipped with a note. Add fairscape-artifacts[review] for the
# AI-Ready review on the datasheet.
artifacts = ["fairscape-artifacts >=0.2.0"]
# --report-fairscape-schemas reads the data files; the per-format readers are
# fairscape-models extras that fairscape-conversion[schemas] pulls in.
schemas = ["fairscape-conversion[schemas] >=0.2.2,<0.3"]
validate = ["fairscape-models"]

[project.urls]
Homepage = "https://github.com/fairscape/snakemake-report-plugin-fairscape"
Repository = "https://github.com/fairscape/snakemake-report-plugin-fairscape"
Issues = "https://github.com/fairscape/snakemake-report-plugin-fairscape/issues"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/report/fairscape.html"

[tool.setuptools]
packages = ["snakemake_report_plugin_fairscape"]

[tool.setuptools.dynamic]
version = { attr = "snakemake_report_plugin_fairscape.__version__" }
