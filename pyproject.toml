[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemake-report-plugin-fairscape"
dynamic = ["version"]
description = "Snakemake report plugin that writes a FAIRSCAPE EVI RO-Crate (ro-crate-metadata.json) for a completed run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Justin Niestroy", email = "jniestroy@gmail.com" },
]
keywords = ["snakemake", "snakemake-plugin", "report", "fairscape", "ro-crate", "provenance", "evi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "snakemake-interface-report-plugins >=1.3.0,<2",
    "snakemake-interface-common",
    "fairscape-conversion >=0.1.0,<0.2",
]

[project.optional-dependencies]
# the derived artifacts (datasheet, evidence graph, LinkML export) are on by
# default but are produced by fairscape-cli; without it the crate is still
# written and those steps are skipped with a note.
# NOTE: they need the importable process_crate/infer_schema added in
# fairscape-cli 1.2.10 -- raise this floor once that release is on PyPI
# (see RELEASING.md).
artifacts = ["fairscape-cli >=1.2.4"]
validate = ["fairscape-models"]

[project.urls]
Homepage = "https://github.com/fairscape/snakemake-report-plugin-fairscape"
Repository = "https://github.com/fairscape/snakemake-report-plugin-fairscape"
Issues = "https://github.com/fairscape/snakemake-report-plugin-fairscape/issues"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/report/fairscape.html"

[tool.setuptools]
packages = ["snakemake_report_plugin_fairscape"]

[tool.setuptools.dynamic]
version = { attr = "snakemake_report_plugin_fairscape.__version__" }
